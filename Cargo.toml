[package]
name = "boogy-db"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
crc32fast = "1"
aes-gcm = "0.10"
rand = "0.9"
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "sqlite_comparison"
harness = false
[[bench]]
name = "point_ops"
harness = false
[[bench]]
name = "profile_ops"
harness = false
[[bench]]
name = "indexed_find_profile"
harness = false
[[bench]]
name = "concurrent_ops"
harness = false
[[bench]]
name = "join_simulation"
harness = false
[[bench]]
name = "bulk_ops"
harness = false
[[bench]]
name = "acid_ops"
harness = false
