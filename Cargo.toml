[package]
name = "boogy-db"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
crc32fast = "1"

[dev-dependencies]
tempfile = "3"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.38", features = ["bundled"] }

[[bench]]
name = "sqlite_comparison"
harness = false
[[bench]]
name = "point_ops"
harness = false
